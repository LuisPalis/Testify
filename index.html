<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testify - LuisPalis</title>
    <style>
        /* Configuraciones generales */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: sans-serif;
        }

        /* Contenedor principal que imita tus columnas */
        .main-container {
            display: flex;
            flex: 1; /* Esto hace que ocupe el espacio medio */
        }

        /* Estilo para las secciones (equivalente a tus frames) */
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }

        /* TAMAÑOS PARA PC */
        .col-izquierda { width: 500px; }
        .col-centro { flex: 1; }
        .col-derecha { width: 200px; }
        .header-footer { height: 80px; }

        /* --- AQUÍ ESTÁ EL MEDIA QUERIE PARA CELULAR --- */
        @media (max-width: 768px) {
            .main-container {
                display: block !important; /* En celular, las columnas se ponen una debajo de otra */
            }

            .col-izquierda, .col1-centro, .col-derecha {
                width: 100% !important;
                display: block;
                height: auto;
                min-height: 200px; /* Les damos una altura fija para que no desaparezcan */
            }
            h1, h2, .titulo {
                font-size: 1.5rem;
                text-align: cente;
            }
            .header-footer {
                height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="header-footer">
        <iframe src="pagina1.html"></iframe>
    </div>

    <div class="main-container">
        <div class="col-izquierda">
            <iframe src="pagina2.html"></iframe>
        </div>
        
        <div class="col-centro">
            <iframe src="pagina3.html" name="centro"></iframe>
        </div>

        <div class="col-derecha">
            <iframe src="pagina5.html"></iframe>
        </div>
    </div>

    <div class="header-footer">
        <iframe src="pagina4.html"></iframe>
    </div>

</body>
</html>
